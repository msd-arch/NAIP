name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static export
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # Real free-tier constraint, not a placeholder: this is Cloudflare's
          # free "quick tunnel" (cloudflared tunnel --url ...) exposing the
          # local submission_server.py bridge -- no domain, no paid Cloudflare
          # plan. Real, honest tradeoff: quick-tunnel URLs are NOT permanent,
          # they change whenever the tunnel process restarts (laptop reboot,
          # crash, cloudflared update). When that happens, Farm Data
          # submissions will fail with a clear "server not reachable" error
          # (see FarmSubmissionForm.tsx) until someone starts a fresh tunnel,
          # updates this one line with the new URL, and pushes again.
          NEXT_PUBLIC_FARM_API_BASE: https://laid-suggested-wood-influenced.trycloudflare.com
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
